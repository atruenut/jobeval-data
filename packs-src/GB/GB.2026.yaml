# United Kingdom, tax year 6 April 2026 to 5 April 2027: income tax for England, Wales and Northern
# Ireland (Scotland has its own pack that replaces the income tax) and employee Class 1 National
# Insurance. The UK has no statutory overtime pay, so no overtime rule is provided.
schema: 1
id: GB-2026
kind: country
region: { country: GB }
valid: { from: 2026-04-06, to: 2027-04-05 }
revision: 1
tier: partial
currency: GBP
requires_engine: ">=1.1"
labels: { en: "United Kingdom (2026-27)", fr: "Royaume-Uni (2026-2027)" }

sources:
  govuk_it: { authority: official, title: "GOV.UK: Income Tax rates and Personal Allowances (tax year 6 April 2026 to 5 April 2027)", url: "https://www.gov.uk/income-tax-rates", retrieved: 2026-11-12 }
  govuk_ni: { authority: official, title: "GOV.UK: rates and allowances, National Insurance contributions (2026 to 2027; monthly thresholds 1,048 and 4,189 correspond to the annual 12,570 and 50,270)", url: "https://www.gov.uk/government/publications/rates-and-allowances-national-insurance-contributions", retrieved: 2026-11-12 }

parameters:
  uk.personal_allowance:
    source: govuk_it
    value: 12570
  uk.allowance_taper_start:
    source: govuk_it
    value: 100000
  # Bands apply to taxable income (income after the Personal Allowance): basic rate on the first
  # 37,700 (50,270 - 12,570), higher rate to 125,140, additional rate above.
  uk.brackets:
    source: govuk_it
    value:
      - { up_to: 37700, rate: 0.20 }
      - { up_to: 125140, rate: 0.40 }
      - { rate: 0.45 }
  uk.ni:
    source: govuk_ni
    value: { primary_threshold: 12570, upper_earnings_limit: 50270, main_rate: 0.08, upper_rate: 0.02 }

inputs:
  gross_annual: { type: money, label: "Annual gross employment income" }
  other_income: { type: money, default: 0, label: "Other taxable income" }
  wage: { type: money, label: "Hourly wage", default: 0 }

rules:
  - { id: income, expr: gross_annual + other_income }
  - id: uk.allowance
    label: { en: "Personal Allowance" }
    note: "12,570, reduced by 1 for every 2 of income over 100,000 (zero at 125,140)."
    expr: max(0, $uk.personal_allowance - max(0, income - $uk.allowance_taper_start) / 2)
  - id: taxable_income
    label: { en: "Taxable income" }
    expr: max(0, income - uk.allowance)
  - id: uk.tax
    public: true
    label: { en: "Income tax" }
    expr: bracket(taxable_income, $uk.brackets)
  - id: ni.employee
    label: { en: "National Insurance (Class 1, employee)" }
    note: "8% between 12,570 and 50,270 of earnings, 2% above."
    expr: max(0, min(gross_annual, $uk.ni.upper_earnings_limit) - $uk.ni.primary_threshold) * $uk.ni.main_rate + max(0, gross_annual - $uk.ni.upper_earnings_limit) * $uk.ni.upper_rate

outputs:
  income_tax:    [uk.tax]
  contributions: [ni.employee]

not_modelled:
  - scottish_rates_apply_in_the_scotland_pack
  - student_loan_and_workplace_pension_deductions
  - savings_dividend_and_marriage_allowances
  - tax_codes_and_benefits_in_kind
  - employer_national_insurance
  - unemployment_benefit_universal_credit
  - statutory_holiday_and_sick_pay_not_modelled
