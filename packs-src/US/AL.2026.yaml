# Alabama, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-AL-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: AL }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: estimate
requires_engine: ">=1.1"
labels: { en: "Alabama (2026)", fr: "Alabama (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  al.brackets_single:
    source: tf_rates
    value:
      - { up_to: 500, rate: 0.02 }
      - { up_to: 3000, rate: 0.04 }
      - { rate: 0.05 }
  al.brackets_mfj:
    source: tf_rates
    value:
      - { up_to: 1000, rate: 0.02 }
      - { up_to: 6000, rate: 0.04 }
      - { rate: 0.05 }
  al.deduction:
    source: tf_rates
    value: { single: 3000, mfj: 8500 }
  al.exemption:
    source: tf_rates
    value: { single: 1500, mfj: 3000 }

rules:
  - id: al.tax
    label: { en: "Alabama income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: if(filing_status == 2, bracket(max(0, agi - if(filing_status == 2, $al.deduction.mfj, $al.deduction.single) - if(filing_status == 2, $al.exemption.mfj, $al.exemption.single)), $al.brackets_mfj), bracket(max(0, agi - if(filing_status == 2, $al.deduction.mfj, $al.deduction.single) - if(filing_status == 2, $al.exemption.mfj, $al.exemption.single)), $al.brackets_single))

append:
  income_tax: [al.tax]

not_modelled:
  - al_federal_income_tax_deduction
  - al_standard_deduction_and_exemption_phase_downs
  - al_local_taxes
  - state_unemployment_benefit
  - state_overtime_rules
