    source: tf_rates
    value:
      - { up_to: 4600, rate: 0.02 }
      - { rate: 0.039 }
  ar.deduction:
    source: tf_rates
    value: { single: 2470, mfj: 4940 }
  ar.credit:
    source: tf_rates
    value: { single: 29, mfj: 58 }

rules:
  - id: ar.tax
    label: { en: "Arkansas income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: max(0, bracket(max(0, agi - if(filing_status == 2, $ar.deduction.mfj, $ar.deduction.single)), $ar.brackets_single) - if(filing_status == 2, $ar.credit.mfj, $ar.credit.single))

append:
  income_tax: [ar.tax]

not_modelled:
  - ar_bracket_widths_are_2025
  - ar_bracket_adjustment_89601_to_92700
  - ar_other_credits
  - state_unemployment_benefit
  - state_overtime_rules
