# California, state layer, tax year 2026. Extends US-2026.
# Personal income tax per the FTB 2026 Schedule X (single filers) plus the 1.3% State Disability
# Insurance payroll contribution. Filing status other than single is not modelled for the state
# (the federal layer's filing_status does not change California's schedule here).
schema: 1
id: US-CA-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: CA }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "California (2026)", fr: "Californie (2026)" }

sources:
  ftb_2026: { authority: official, title: "California Franchise Tax Board: Tax News October 2026 (2026 Schedule X, standard deduction, exemption credit; complete 2026 schedules due late December)", url: "https://www.ftb.ca.gov/about-ftb/newsroom/tax-news/2026/10.html", retrieved: 2026-11-12 }
  edd_rates: { authority: official, title: "California EDD: contribution rates and withholding schedules (2026 SDI rate 1.3%, no wage limit)", url: "https://edd.ca.gov/en/payroll_taxes/rates_and_withholding", retrieved: 2026-11-12 }

parameters:
  ca.brackets:
    source: ftb_2026
    value:
      - { up_to: 11456, rate: 0.01 }
      - { up_to: 27157, rate: 0.02 }
      - { up_to: 42861, rate: 0.04 }
      - { up_to: 59498, rate: 0.06 }
      - { up_to: 75197, rate: 0.08 }
      - { up_to: 384109, rate: 0.093 }
      - { up_to: 460927, rate: 0.103 }
      - { up_to: 768213, rate: 0.113 }
      - { rate: 0.123 }
  ca.standard_deduction:
    source: ftb_2026
    value: 5900
  ca.exemption_credit:
    source: ftb_2026
    value: 158
  ca.sdi_rate:
    source: edd_rates
    value: 0.013
  # 1% Mental Health Services Tax on taxable income over 1,000,000 (long-standing statute; not
  # restated on the cited page).
rules:
  - id: ca.taxable
    note: "Income less the single-filer standard deduction."
    expr: max(0, agi - $ca.standard_deduction)
  - id: ca.tax
    label: { en: "California income tax" }
    note: "Schedule X tax on taxable income, less the personal exemption credit."
    expr: max(0, bracket(ca.taxable, $ca.brackets) - $ca.exemption_credit)
  - id: ca.sdi
    label: { en: "California State Disability Insurance" }
    note: "1.3% of all wages, no wage limit."
    expr: gross_annual * $ca.sdi_rate

append:
  income_tax: [ca.tax]
  contributions: [ca.sdi]

not_modelled:
  - ca_mental_health_services_tax_over_1m
  - ca_filing_status_other_than_single
  - ca_renters_and_other_credits
  - ca_daily_overtime_and_double_time
  - ca_paid_family_leave_is_part_of_sdi
  - state_unemployment_benefit
