# Colorado, state layer, tax year 2026. Extends US-2026.
schema: 1
id: US-CO-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: CO }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Colorado (2026)", fr: "Colorado (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  co.rate:
    source: tf_rates
    value: 0.044

rules:
  - id: co.tax
    label: { en: "Colorado income tax" }
    note: "4.4% flat rate of federal taxable income (Colorado starts from it, so the federal standard deduction for the chosen filing status applies)."
    expr: taxable_income * $co.rate

append:
  income_tax: [co.tax]

not_modelled:
  - co_rate_can_fall_under_tabor_refund_mechanism
  - co_credits
  - co_family_leave_premium
  - state_unemployment_benefit
  - state_overtime_rules
