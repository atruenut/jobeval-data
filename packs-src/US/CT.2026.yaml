# Connecticut, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-CT-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: CT }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: estimate
requires_engine: ">=1.1"
labels: { en: "Connecticut (2026)", fr: "Connecticut (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  ct.brackets_single:
    source: tf_rates
    value:
      - { up_to: 10000, rate: 0.02 }
      - { up_to: 50000, rate: 0.045 }
      - { up_to: 100000, rate: 0.055 }
      - { up_to: 200000, rate: 0.06 }
      - { up_to: 250000, rate: 0.065 }
      - { up_to: 500000, rate: 0.069 }
      - { rate: 0.0699 }
  ct.brackets_mfj:
    source: tf_rates
    value:
      - { up_to: 20000, rate: 0.02 }
      - { up_to: 100000, rate: 0.045 }
      - { up_to: 200000, rate: 0.055 }
      - { up_to: 400000, rate: 0.06 }
      - { up_to: 500000, rate: 0.065 }
      - { up_to: 1000000, rate: 0.069 }
      - { rate: 0.0699 }

rules:
  - id: ct.tax
    label: { en: "Connecticut income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: if(filing_status == 2, bracket(agi, $ct.brackets_mfj), bracket(agi, $ct.brackets_single))

append:
  income_tax: [ct.tax]

not_modelled:
  - ct_personal_exemption_15000_single_24000_joint_with_phase_out
  - ct_tax_benefit_recapture
  - ct_credits
  - state_unemployment_benefit
  - state_overtime_rules
