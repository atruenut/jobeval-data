# District of Columbia, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-DC-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: DC }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "District of Columbia (2026)", fr: "District de Columbia (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  dc.brackets_single:
    source: tf_rates
    value:
      - { up_to: 10000, rate: 0.04 }
      - { up_to: 40000, rate: 0.06 }
      - { up_to: 60000, rate: 0.065 }
      - { up_to: 250000, rate: 0.085 }
      - { up_to: 500000, rate: 0.0925 }
      - { up_to: 1000000, rate: 0.0975 }
      - { rate: 0.1075 }

rules:
  - id: dc.tax
    label: { en: "District of Columbia income tax" }
    note: "Bracketed tax on federal taxable income; married filing jointly uses the joint amounts, head of household the single ones."
    expr: bracket(taxable_income, $dc.brackets_single)

append:
  income_tax: [dc.tax]

not_modelled:
  - dc_credits
  - state_unemployment_benefit
  - state_overtime_rules
