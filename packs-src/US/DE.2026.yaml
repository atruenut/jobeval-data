# Delaware, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-DE-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: DE }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Delaware (2026)", fr: "Delaware (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  de.brackets_single:
    source: tf_rates
    value:
      - { up_to: 2000, rate: 0 }
      - { up_to: 5000, rate: 0.022 }
      - { up_to: 10000, rate: 0.039 }
      - { up_to: 20000, rate: 0.048 }
      - { up_to: 25000, rate: 0.052 }
      - { up_to: 60000, rate: 0.0555 }
      - { rate: 0.066 }
  de.deduction:
    source: tf_rates
    value: { single: 3250, mfj: 6500 }
  de.credit:
    source: tf_rates
    value: { single: 110, mfj: 220 }

rules:
  - id: de.tax
    label: { en: "Delaware income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: max(0, bracket(max(0, agi - if(filing_status == 2, $de.deduction.mfj, $de.deduction.single)), $de.brackets_single) - if(filing_status == 2, $de.credit.mfj, $de.credit.single))

append:
  income_tax: [de.tax]

not_modelled:
  - de_other_credits
  - de_local_wilmington_tax
  - state_unemployment_benefit
  - state_overtime_rules
