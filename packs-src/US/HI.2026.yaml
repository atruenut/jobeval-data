rules:
  - id: hi.tax
    label: { en: "Hawaii income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: if(filing_status == 2, bracket(max(0, agi - if(filing_status == 2, $hi.deduction.mfj, $hi.deduction.single) - if(filing_status == 2, $hi.exemption.mfj, $hi.exemption.single)), $hi.brackets_mfj), bracket(max(0, agi - if(filing_status == 2, $hi.deduction.mfj, $hi.deduction.single) - if(filing_status == 2, $hi.exemption.mfj, $hi.exemption.single)), $hi.brackets_single))

append:
