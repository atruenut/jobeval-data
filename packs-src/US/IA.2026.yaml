# Iowa, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-IA-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: IA }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Iowa (2026)", fr: "Iowa (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  ia.brackets_single:
    source: tf_rates
    value:
      - { rate: 0.038 }
  ia.credit:
    source: tf_rates
    value: { single: 40, mfj: 80 }

rules:
  - id: ia.tax
    label: { en: "Iowa income tax" }
    note: "Bracketed tax on federal taxable income; married filing jointly uses the joint amounts, head of household the single ones."
    expr: max(0, bracket(taxable_income, $ia.brackets_single) - if(filing_status == 2, $ia.credit.mfj, $ia.credit.single))

append:
  income_tax: [ia.tax]

not_modelled:
  - ia_other_credits
  - state_unemployment_benefit
  - state_overtime_rules
