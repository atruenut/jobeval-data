# Idaho, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-ID-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: ID }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Idaho (2026)", fr: "Idaho (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  id.brackets_single:
    source: tf_rates
    value:
      - { up_to: 4811, rate: 0 }
      - { rate: 0.053 }
  id.brackets_mfj:
    source: tf_rates
    value:
      - { up_to: 9622, rate: 0 }
      - { rate: 0.053 }

rules:
  - id: id.tax
    label: { en: "Idaho income tax" }
    note: "Bracketed tax on federal taxable income; married filing jointly uses the joint amounts, head of household the single ones."
    expr: if(filing_status == 2, bracket(taxable_income, $id.brackets_mfj), bracket(taxable_income, $id.brackets_single))

append:
  income_tax: [id.tax]

not_modelled:
  - id_bracket_widths_are_2025
  - id_credits
  - state_unemployment_benefit
  - state_overtime_rules
