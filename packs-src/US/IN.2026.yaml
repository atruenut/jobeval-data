# Indiana, state layer, tax year 2026. Extends US-2026.
schema: 1
id: US-IN-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: IN }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Indiana (2026)", fr: "Indiana (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  in.rate:
    source: tf_rates
    value: 0.0295
  in.exemption.single:
    source: tf_rates
    value: 1000
  in.exemption.mfj:
    source: tf_rates
    value: 2000

rules:
  - id: in.tax
    label: { en: "Indiana income tax" }
    note: "2.95% flat rate of income less the personal exemption (1,000 single, 2,000 married filing jointly; head of household uses the single amount)."
    expr: max(0, agi - if(filing_status == 2, $in.exemption.mfj, $in.exemption.single)) * $in.rate

append:
  income_tax: [in.tax]

not_modelled:
  - in_county_income_taxes
  - in_dependent_exemptions
  - in_rate_drops_to_2_9_percent_2027
  - state_unemployment_benefit
  - state_overtime_rules
