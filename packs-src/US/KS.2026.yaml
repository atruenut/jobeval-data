# Kansas, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-KS-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: KS }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Kansas (2026)", fr: "Kansas (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  ks.brackets_single:
    source: tf_rates
    value:
      - { up_to: 23000, rate: 0.052 }
      - { rate: 0.0558 }
  ks.brackets_mfj:
    source: tf_rates
    value:
      - { up_to: 46000, rate: 0.052 }
      - { rate: 0.0558 }
  ks.deduction:
    source: tf_rates
    value: { single: 3605, mfj: 8240 }
  ks.exemption:
    source: tf_rates
    value: { single: 9160, mfj: 18320 }

rules:
  - id: ks.tax
    label: { en: "Kansas income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: if(filing_status == 2, bracket(max(0, agi - if(filing_status == 2, $ks.deduction.mfj, $ks.deduction.single) - if(filing_status == 2, $ks.exemption.mfj, $ks.exemption.single)), $ks.brackets_mfj), bracket(max(0, agi - if(filing_status == 2, $ks.deduction.mfj, $ks.deduction.single) - if(filing_status == 2, $ks.exemption.mfj, $ks.exemption.single)), $ks.brackets_single))

append:
  income_tax: [ks.tax]

not_modelled:
  - ks_credits
  - state_unemployment_benefit
  - state_overtime_rules
