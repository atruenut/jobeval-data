# Louisiana, state layer, tax year 2026. Extends US-2026.
schema: 1
id: US-LA-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: LA }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Louisiana (2026)", fr: "Louisiane (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  la.rate:
    source: tf_rates
    value: 0.03
  la.deduction.single:
    source: tf_rates
    value: 12875
  la.deduction.mfj:
    source: tf_rates
    value: 25750

rules:
  - id: la.tax
    label: { en: "Louisiana income tax" }
    note: "3% flat rate of income less the standard deduction (single 12,875, married filing jointly 25,750; head of household uses the single amount)."
    expr: max(0, agi - if(filing_status == 2, $la.deduction.mfj, $la.deduction.single)) * $la.rate

append:
  income_tax: [la.tax]

not_modelled:
  - la_hoh_deduction_unconfirmed
  - la_credits
  - state_unemployment_benefit
  - state_overtime_rules
