# Massachusetts, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-MA-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: MA }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Massachusetts (2026)", fr: "Massachusetts (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  ma.brackets_single:
    source: tf_rates
    value:
      - { up_to: 1083150, rate: 0.05 }
      - { rate: 0.09 }
  ma.exemption:
    source: tf_rates
    value: { single: 4400, mfj: 8800 }

rules:
  - id: ma.tax
    label: { en: "Massachusetts income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: bracket(max(0, agi - if(filing_status == 2, $ma.exemption.mfj, $ma.exemption.single)), $ma.brackets_single)

append:
  income_tax: [ma.tax]

not_modelled:
  - ma_paid_family_medical_leave_premium
  - ma_credits_and_other_deductions
  - state_unemployment_benefit
  - state_overtime_rules
