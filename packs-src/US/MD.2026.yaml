# Maryland, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-MD-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: MD }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Maryland (2026)", fr: "Maryland (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  md.brackets_single:
    source: tf_rates
    value:
      - { up_to: 1000, rate: 0.02 }
      - { up_to: 2000, rate: 0.03 }
      - { up_to: 3000, rate: 0.04 }
      - { up_to: 100000, rate: 0.0475 }
      - { up_to: 125000, rate: 0.05 }
      - { up_to: 150000, rate: 0.0525 }
      - { up_to: 250000, rate: 0.055 }
      - { up_to: 500000, rate: 0.0575 }
      - { up_to: 1000000, rate: 0.0625 }
      - { rate: 0.065 }
  md.brackets_mfj:
    source: tf_rates
    value:
      - { up_to: 1000, rate: 0.02 }
      - { up_to: 2000, rate: 0.03 }
      - { up_to: 3000, rate: 0.04 }
      - { up_to: 150000, rate: 0.0475 }
      - { up_to: 175000, rate: 0.05 }
      - { up_to: 225000, rate: 0.0525 }
      - { up_to: 300000, rate: 0.055 }
      - { up_to: 600000, rate: 0.0575 }
      - { up_to: 1200000, rate: 0.0625 }
      - { rate: 0.065 }
  md.deduction:
    source: tf_rates
    value: { single: 3350, mfj: 6700 }
  md.exemption:
    source: tf_rates
    value: { single: 3200, mfj: 6400 }

rules:
  - id: md.tax
    label: { en: "Maryland income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: if(filing_status == 2, bracket(max(0, agi - if(filing_status == 2, $md.deduction.mfj, $md.deduction.single) - if(filing_status == 2, $md.exemption.mfj, $md.exemption.single)), $md.brackets_mfj), bracket(max(0, agi - if(filing_status == 2, $md.deduction.mfj, $md.deduction.single) - if(filing_status == 2, $md.exemption.mfj, $md.exemption.single)), $md.brackets_single))

append:
  income_tax: [md.tax]

not_modelled:
  - md_local_income_taxes
  - md_exemption_phase_out
  - md_standard_deduction_percent_formula
  - state_unemployment_benefit
  - state_overtime_rules
