# Maine, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-ME-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: ME }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Maine (2026)", fr: "Maine (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  me.brackets_single:
    source: tf_rates
    value:
      - { up_to: 27399, rate: 0.058 }
      - { up_to: 64849, rate: 0.0675 }
      - { rate: 0.0715 }
  me.brackets_mfj:
    source: tf_rates
    value:
      - { up_to: 54849, rate: 0.058 }
      - { up_to: 129749, rate: 0.0675 }
      - { rate: 0.0715 }
  me.deduction:
    source: tf_rates
    value: { single: 8350, mfj: 16700 }
  me.exemption:
    source: tf_rates
    value: { single: 5300, mfj: 10600 }

rules:
  - id: me.tax
    label: { en: "Maine income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: if(filing_status == 2, bracket(max(0, agi - if(filing_status == 2, $me.deduction.mfj, $me.deduction.single) - if(filing_status == 2, $me.exemption.mfj, $me.exemption.single)), $me.brackets_mfj), bracket(max(0, agi - if(filing_status == 2, $me.deduction.mfj, $me.deduction.single) - if(filing_status == 2, $me.exemption.mfj, $me.exemption.single)), $me.brackets_single))

append:
  income_tax: [me.tax]

not_modelled:
  - me_standard_deduction_phase_out
  - me_credits
  - state_unemployment_benefit
  - state_overtime_rules
