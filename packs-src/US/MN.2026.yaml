# Minnesota, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-MN-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: MN }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Minnesota (2026)", fr: "Minnesota (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  mn.brackets_single:
    source: tf_rates
    value:
      - { up_to: 33310, rate: 0.0535 }
      - { up_to: 109430, rate: 0.068 }
      - { up_to: 203150, rate: 0.0785 }
      - { rate: 0.0985 }
  mn.brackets_mfj:
    source: tf_rates
    value:
      - { up_to: 48700, rate: 0.0535 }
      - { up_to: 193480, rate: 0.068 }
      - { up_to: 337930, rate: 0.0785 }
      - { rate: 0.0985 }
  mn.deduction:
    source: tf_rates
    value: { single: 15300, mfj: 30600 }

rules:
  - id: mn.tax
    label: { en: "Minnesota income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: if(filing_status == 2, bracket(max(0, agi - if(filing_status == 2, $mn.deduction.mfj, $mn.deduction.single)), $mn.brackets_mfj), bracket(max(0, agi - if(filing_status == 2, $mn.deduction.mfj, $mn.deduction.single)), $mn.brackets_single))

append:
  income_tax: [mn.tax]

not_modelled:
  - mn_standard_deduction_reduction_at_high_income
  - mn_paid_leave_premium
  - state_unemployment_benefit
  - state_overtime_rules
