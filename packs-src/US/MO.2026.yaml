# Missouri, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-MO-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: MO }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Missouri (2026)", fr: "Missouri (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  mo.brackets_single:
    source: tf_rates
    value:
      - { up_to: 1348, rate: 0 }
      - { up_to: 2696, rate: 0.02 }
      - { up_to: 4044, rate: 0.025 }
      - { up_to: 5392, rate: 0.03 }
      - { up_to: 6740, rate: 0.035 }
      - { up_to: 8088, rate: 0.04 }
      - { up_to: 9436, rate: 0.045 }
      - { rate: 0.047 }

rules:
  - id: mo.tax
    label: { en: "Missouri income tax" }
    note: "Bracketed tax on federal taxable income; married filing jointly uses the joint amounts, head of household the single ones."
    expr: bracket(taxable_income, $mo.brackets_single)

append:
  income_tax: [mo.tax]

not_modelled:
  - mo_federal_tax_deduction
  - mo_credits
  - state_unemployment_benefit
  - state_overtime_rules
