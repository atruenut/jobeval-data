# Mississippi, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-MS-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: MS }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Mississippi (2026)", fr: "Mississippi (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  ms.brackets_single:
    source: tf_rates
    value:
      - { up_to: 10000, rate: 0 }
      - { rate: 0.04 }
  ms.deduction:
    source: tf_rates
    value: { single: 2300, mfj: 4600 }
  ms.exemption:
    source: tf_rates
    value: { single: 6000, mfj: 12000 }

rules:
  - id: ms.tax
    label: { en: "Mississippi income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: bracket(max(0, agi - if(filing_status == 2, $ms.deduction.mfj, $ms.deduction.single) - if(filing_status == 2, $ms.exemption.mfj, $ms.exemption.single)), $ms.brackets_single)

append:
  income_tax: [ms.tax]

not_modelled:
  - ms_other_deductions
  - state_unemployment_benefit
  - state_overtime_rules
