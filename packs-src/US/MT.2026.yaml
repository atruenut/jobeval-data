# Montana, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-MT-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: MT }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Montana (2026)", fr: "Montana (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  mt.brackets_single:
    source: tf_rates
    value:
      - { up_to: 47500, rate: 0.047 }
      - { rate: 0.0565 }
  mt.brackets_mfj:
    source: tf_rates
    value:
      - { up_to: 95000, rate: 0.047 }
      - { rate: 0.0565 }

rules:
  - id: mt.tax
    label: { en: "Montana income tax" }
    note: "Bracketed tax on federal taxable income; married filing jointly uses the joint amounts, head of household the single ones."
    expr: if(filing_status == 2, bracket(taxable_income, $mt.brackets_mfj), bracket(taxable_income, $mt.brackets_single))

append:
  income_tax: [mt.tax]

not_modelled:
  - mt_credits
  - state_unemployment_benefit
  - state_overtime_rules
