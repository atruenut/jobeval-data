# North Dakota, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-ND-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: ND }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "North Dakota (2026)", fr: "Dakota du Nord (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  nd.brackets_single:
    source: tf_rates
    value:
      - { up_to: 48475, rate: 0 }
      - { up_to: 244825, rate: 0.0195 }
      - { rate: 0.025 }
  nd.brackets_mfj:
    source: tf_rates
    value:
      - { up_to: 80975, rate: 0 }
      - { up_to: 298075, rate: 0.0195 }
      - { rate: 0.025 }

rules:
  - id: nd.tax
    label: { en: "North Dakota income tax" }
    note: "Bracketed tax on federal taxable income; married filing jointly uses the joint amounts, head of household the single ones."
    expr: if(filing_status == 2, bracket(taxable_income, $nd.brackets_mfj), bracket(taxable_income, $nd.brackets_single))

append:
  income_tax: [nd.tax]

not_modelled:
  - nd_credits
  - state_unemployment_benefit
  - state_overtime_rules
