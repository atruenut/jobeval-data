# Nebraska, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-NE-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: NE }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Nebraska (2026)", fr: "Nebraska (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  ne.brackets_single:
    source: tf_rates
    value:
      - { up_to: 4130, rate: 0.0246 }
      - { up_to: 24760, rate: 0.0351 }
      - { rate: 0.0455 }
  ne.brackets_mfj:
    source: tf_rates
    value:
      - { up_to: 8250, rate: 0.0246 }
      - { up_to: 49530, rate: 0.0351 }
      - { rate: 0.0455 }
  ne.deduction:
    source: tf_rates
    value: { single: 8850, mfj: 17700 }
  ne.credit:
    source: tf_rates
    value: { single: 176, mfj: 352 }

rules:
  - id: ne.tax
    label: { en: "Nebraska income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: max(0, if(filing_status == 2, bracket(max(0, agi - if(filing_status == 2, $ne.deduction.mfj, $ne.deduction.single)), $ne.brackets_mfj), bracket(max(0, agi - if(filing_status == 2, $ne.deduction.mfj, $ne.deduction.single)), $ne.brackets_single)) - if(filing_status == 2, $ne.credit.mfj, $ne.credit.single))

append:
  income_tax: [ne.tax]

not_modelled:
  - ne_other_credits
  - state_unemployment_benefit
  - state_overtime_rules
