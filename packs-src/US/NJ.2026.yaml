# New Jersey, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-NJ-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: NJ }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "New Jersey (2026)", fr: "New Jersey (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  nj.brackets_single:
    source: tf_rates
    value:
      - { up_to: 20000, rate: 0.014 }
      - { up_to: 35000, rate: 0.0175 }
      - { up_to: 40000, rate: 0.035 }
      - { up_to: 75000, rate: 0.0553 }
      - { up_to: 500000, rate: 0.0637 }
      - { up_to: 1000000, rate: 0.0897 }
      - { rate: 0.1075 }
  nj.brackets_mfj:
    source: tf_rates
    value:
      - { up_to: 20000, rate: 0.014 }
      - { up_to: 50000, rate: 0.0175 }
      - { up_to: 70000, rate: 0.0245 }
      - { up_to: 80000, rate: 0.035 }
      - { up_to: 150000, rate: 0.0553 }
      - { up_to: 500000, rate: 0.0637 }
      - { up_to: 1000000, rate: 0.0897 }
      - { rate: 0.1075 }
  nj.exemption:
    source: tf_rates
    value: { single: 1000, mfj: 2000 }

rules:
  - id: nj.tax
    label: { en: "New Jersey income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: if(filing_status == 2, bracket(max(0, agi - if(filing_status == 2, $nj.exemption.mfj, $nj.exemption.single)), $nj.brackets_mfj), bracket(max(0, agi - if(filing_status == 2, $nj.exemption.mfj, $nj.exemption.single)), $nj.brackets_single))

append:
  income_tax: [nj.tax]

not_modelled:
  - nj_other_deductions
  - nj_sdi_and_family_leave_payroll_taxes
  - state_unemployment_benefit
  - state_overtime_rules
