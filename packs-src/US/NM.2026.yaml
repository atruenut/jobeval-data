# New Mexico, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-NM-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: NM }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "New Mexico (2026)", fr: "Nouveau-Mexique (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  nm.brackets_single:
    source: tf_rates
    value:
      - { up_to: 5500, rate: 0.015 }
      - { up_to: 16500, rate: 0.032 }
      - { up_to: 33500, rate: 0.043 }
      - { up_to: 66500, rate: 0.047 }
      - { up_to: 210000, rate: 0.049 }
      - { rate: 0.059 }
  nm.brackets_mfj:
    source: tf_rates
    value:
      - { up_to: 8000, rate: 0.015 }
      - { up_to: 25000, rate: 0.032 }
      - { up_to: 50000, rate: 0.043 }
      - { up_to: 100000, rate: 0.047 }
      - { up_to: 315000, rate: 0.049 }
      - { rate: 0.059 }

rules:
  - id: nm.tax
    label: { en: "New Mexico income tax" }
    note: "Bracketed tax on federal taxable income; married filing jointly uses the joint amounts, head of household the single ones."
    expr: if(filing_status == 2, bracket(taxable_income, $nm.brackets_mfj), bracket(taxable_income, $nm.brackets_single))

append:
  income_tax: [nm.tax]

not_modelled:
  - nm_credits
  - state_unemployment_benefit
  - state_overtime_rules
