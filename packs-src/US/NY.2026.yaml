    source: tf_rates
    value:
      - { up_to: 8500, rate: 0.039 }
      - { up_to: 11700, rate: 0.044 }
      - { up_to: 13900, rate: 0.0515 }
      - { up_to: 80650, rate: 0.054 }
      - { up_to: 215400, rate: 0.059 }
      - { up_to: 1077550, rate: 0.0685 }
      - { up_to: 5000000, rate: 0.0965 }
      - { up_to: 25000000, rate: 0.103 }
      - { rate: 0.109 }
  ny.brackets_mfj:
    source: tf_rates
    value:
      - { up_to: 17150, rate: 0.039 }
      - { up_to: 23600, rate: 0.044 }
      - { up_to: 27900, rate: 0.0515 }
      - { up_to: 161550, rate: 0.054 }
      - { up_to: 323200, rate: 0.059 }
      - { up_to: 2155350, rate: 0.0685 }
      - { up_to: 5000000, rate: 0.0965 }
      - { up_to: 25000000, rate: 0.103 }
      - { rate: 0.109 }
  ny.deduction:
    source: tf_rates
    value: { single: 8000, mfj: 16050 }

rules:
  - id: ny.tax
    label: { en: "New York income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: if(filing_status == 2, bracket(max(0, agi - if(filing_status == 2, $ny.deduction.mfj, $ny.deduction.single)), $ny.brackets_mfj), bracket(max(0, agi - if(filing_status == 2, $ny.deduction.mfj, $ny.deduction.single)), $ny.brackets_single))

append:
  income_tax: [ny.tax]

not_modelled:
