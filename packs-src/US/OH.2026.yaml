# Ohio, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-OH-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: OH }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Ohio (2026)", fr: "Ohio (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  oh.brackets_single:
    source: tf_rates
    value:
      - { up_to: 26050, rate: 0 }
      - { rate: 0.0275 }
  oh.exemption:
    source: tf_rates
    value: { single: 2400, mfj: 4800 }

rules:
  - id: oh.tax
    label: { en: "Ohio income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: bracket(max(0, agi - if(filing_status == 2, $oh.exemption.mfj, $oh.exemption.single)), $oh.brackets_single)

append:
  income_tax: [oh.tax]

not_modelled:
  - oh_exemption_depends_on_income
  - oh_local_income_taxes
  - oh_credits
  - state_unemployment_benefit
  - state_overtime_rules
