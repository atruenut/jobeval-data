# Oklahoma, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-OK-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: OK }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Oklahoma (2026)", fr: "Oklahoma (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  ok.brackets_single:
    source: tf_rates
    value:
      - { up_to: 3750, rate: 0 }
      - { up_to: 4900, rate: 0.025 }
      - { up_to: 7200, rate: 0.035 }
      - { rate: 0.045 }
  ok.brackets_mfj:
    source: tf_rates
    value:
      - { up_to: 7500, rate: 0 }
      - { up_to: 9800, rate: 0.025 }
      - { up_to: 14400, rate: 0.035 }
      - { rate: 0.045 }
  ok.deduction:
    source: tf_rates
    value: { single: 6350, mfj: 12700 }
  ok.exemption:
    source: tf_rates
    value: { single: 1000, mfj: 2000 }

rules:
  - id: ok.tax
    label: { en: "Oklahoma income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: if(filing_status == 2, bracket(max(0, agi - if(filing_status == 2, $ok.deduction.mfj, $ok.deduction.single) - if(filing_status == 2, $ok.exemption.mfj, $ok.exemption.single)), $ok.brackets_mfj), bracket(max(0, agi - if(filing_status == 2, $ok.deduction.mfj, $ok.deduction.single) - if(filing_status == 2, $ok.exemption.mfj, $ok.exemption.single)), $ok.brackets_single))

append:
  income_tax: [ok.tax]

not_modelled:
  - ok_credits
  - state_unemployment_benefit
  - state_overtime_rules
