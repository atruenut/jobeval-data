# Oregon, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-OR-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: OR }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: estimate
requires_engine: ">=1.1"
labels: { en: "Oregon (2026)", fr: "Oregon (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  or.brackets_single:
    source: tf_rates
    value:
      - { up_to: 4550, rate: 0.0475 }
      - { up_to: 11400, rate: 0.0675 }
      - { up_to: 125000, rate: 0.0875 }
      - { rate: 0.099 }
  or.brackets_mfj:
    source: tf_rates
    value:
      - { up_to: 9100, rate: 0.0475 }
      - { up_to: 22800, rate: 0.0675 }
      - { up_to: 250000, rate: 0.0875 }
      - { rate: 0.099 }
  or.deduction:
    source: tf_rates
    value: { single: 2910, mfj: 5820 }
  or.credit:
    source: tf_rates
    value: { single: 256, mfj: 512 }

rules:
  - id: or.tax
    label: { en: "Oregon income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: max(0, if(filing_status == 2, bracket(max(0, agi - if(filing_status == 2, $or.deduction.mfj, $or.deduction.single)), $or.brackets_mfj), bracket(max(0, agi - if(filing_status == 2, $or.deduction.mfj, $or.deduction.single)), $or.brackets_single)) - if(filing_status == 2, $or.credit.mfj, $or.credit.single))

append:
  income_tax: [or.tax]

not_modelled:
  - or_federal_income_tax_subtraction
  - or_statewide_transit_tax
  - or_paid_leave_premium
  - or_other_credits
  - state_unemployment_benefit
  - state_overtime_rules
