# Rhode Island, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-RI-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: RI }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Rhode Island (2026)", fr: "Rhode Island (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  ri.brackets_single:
    source: tf_rates
    value:
      - { up_to: 82050, rate: 0.0375 }
      - { up_to: 186450, rate: 0.0475 }
      - { rate: 0.0599 }
  ri.deduction:
    source: tf_rates
    value: { single: 11200, mfj: 22400 }
  ri.exemption:
    source: tf_rates
    value: { single: 5250, mfj: 10500 }

rules:
  - id: ri.tax
    label: { en: "Rhode Island income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: bracket(max(0, agi - if(filing_status == 2, $ri.deduction.mfj, $ri.deduction.single) - if(filing_status == 2, $ri.exemption.mfj, $ri.exemption.single)), $ri.brackets_single)

append:
  income_tax: [ri.tax]

not_modelled:
  - ri_standard_deduction_and_exemption_phase_outs
  - ri_tdi_premium
  - state_unemployment_benefit
  - state_overtime_rules
