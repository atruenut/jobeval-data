# South Carolina, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-SC-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: SC }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "South Carolina (2026)", fr: "Caroline du Sud (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  sc.brackets_single:
    source: tf_rates
    value:
      - { up_to: 3640, rate: 0 }
      - { up_to: 18230, rate: 0.03 }
      - { rate: 0.06 }
  sc.deduction:
    source: tf_rates
    value: { single: 8350, mfj: 16700 }

rules:
  - id: sc.tax
    label: { en: "South Carolina income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: bracket(max(0, agi - if(filing_status == 2, $sc.deduction.mfj, $sc.deduction.single)), $sc.brackets_single)

append:
  income_tax: [sc.tax]

not_modelled:
  - sc_credits
  - state_unemployment_benefit
  - state_overtime_rules
