# Utah, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-UT-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: UT }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: estimate
requires_engine: ">=1.1"
labels: { en: "Utah (2026)", fr: "Utah (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  ut.brackets_single:
    source: tf_rates
    value:
      - { rate: 0.045 }
  ut.credit:
    source: tf_rates
    value: { single: 966, mfj: 1932 }

rules:
  - id: ut.tax
    label: { en: "Utah income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: max(0, bracket(agi, $ut.brackets_single) - if(filing_status == 2, $ut.credit.mfj, $ut.credit.single))

append:
  income_tax: [ut.tax]

not_modelled:
  - ut_taxpayer_credit_phase_out
  - ut_other_credits
  - state_unemployment_benefit
  - state_overtime_rules
