# Virginia, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-VA-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: VA }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Virginia (2026)", fr: "Virginie (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  va.brackets_single:
    source: tf_rates
    value:
      - { up_to: 3000, rate: 0.02 }
      - { up_to: 5000, rate: 0.03 }
      - { up_to: 17000, rate: 0.05 }
      - { rate: 0.0575 }
  va.deduction:
    source: tf_rates
    value: { single: 8750, mfj: 17500 }
  va.exemption:
    source: tf_rates
    value: { single: 930, mfj: 1860 }

rules:
  - id: va.tax
    label: { en: "Virginia income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: bracket(max(0, agi - if(filing_status == 2, $va.deduction.mfj, $va.deduction.single) - if(filing_status == 2, $va.exemption.mfj, $va.exemption.single)), $va.brackets_single)

append:
  income_tax: [va.tax]

not_modelled:
  - va_exemption_unavailable_at_high_income
  - va_credits
  - state_unemployment_benefit
  - state_overtime_rules
