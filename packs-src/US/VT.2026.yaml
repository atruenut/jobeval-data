# Vermont, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-VT-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: VT }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Vermont (2026)", fr: "Vermont (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  vt.brackets_single:
    source: tf_rates
    value:
      - { up_to: 49400, rate: 0.0335 }
      - { up_to: 119700, rate: 0.066 }
      - { up_to: 249700, rate: 0.076 }
      - { rate: 0.0875 }
  vt.brackets_mfj:
    source: tf_rates
    value:
      - { up_to: 82500, rate: 0.0335 }
      - { up_to: 199450, rate: 0.066 }
      - { up_to: 304000, rate: 0.076 }
      - { rate: 0.0875 }
  vt.deduction:
    source: tf_rates
    value: { single: 7650, mfj: 15300 }
  vt.exemption:
    source: tf_rates
    value: { single: 5300, mfj: 10600 }

rules:
  - id: vt.tax
    label: { en: "Vermont income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: if(filing_status == 2, bracket(max(0, agi - if(filing_status == 2, $vt.deduction.mfj, $vt.deduction.single) - if(filing_status == 2, $vt.exemption.mfj, $vt.exemption.single)), $vt.brackets_mfj), bracket(max(0, agi - if(filing_status == 2, $vt.deduction.mfj, $vt.deduction.single) - if(filing_status == 2, $vt.exemption.mfj, $vt.exemption.single)), $vt.brackets_single))

append:
  income_tax: [vt.tax]

not_modelled:
  - vt_credits
  - state_unemployment_benefit
  - state_overtime_rules
