# Wisconsin, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-WI-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: WI }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "Wisconsin (2026)", fr: "Wisconsin (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  wi.brackets_single:
    source: tf_rates
    value:
      - { up_to: 15110, rate: 0.035 }
      - { up_to: 51950, rate: 0.044 }
      - { up_to: 332720, rate: 0.053 }
      - { rate: 0.0765 }
  wi.brackets_mfj:
    source: tf_rates
    value:
      - { up_to: 20150, rate: 0.035 }
      - { up_to: 69260, rate: 0.044 }
      - { up_to: 443630, rate: 0.053 }
      - { rate: 0.0765 }
  wi.deduction:
    source: tf_rates
    value: { single: 13960, mfj: 25840 }
  wi.exemption:
    source: tf_rates
    value: { single: 700, mfj: 1400 }

rules:
  - id: wi.tax
    label: { en: "Wisconsin income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: if(filing_status == 2, bracket(max(0, agi - if(filing_status == 2, $wi.deduction.mfj, $wi.deduction.single) - if(filing_status == 2, $wi.exemption.mfj, $wi.exemption.single)), $wi.brackets_mfj), bracket(max(0, agi - if(filing_status == 2, $wi.deduction.mfj, $wi.deduction.single) - if(filing_status == 2, $wi.exemption.mfj, $wi.exemption.single)), $wi.brackets_single))

append:
  income_tax: [wi.tax]

not_modelled:
  - wi_standard_deduction_phase_out
  - wi_credits
  - state_unemployment_benefit
  - state_overtime_rules
