# West Virginia, state layer, tax year 2026. Extends US-2026. Generated by tools/gen_us_graduated.py from tools/us_graduated_data.py.
schema: 1
id: US-WV-2026
kind: subregion
extends: US-2026
region: { country: US, subregion: WV }
valid: { from: 2026-01-01, to: 2026-12-31 }
revision: 1
tier: partial
requires_engine: ">=1.1"
labels: { en: "West Virginia (2026)", fr: "Virginie-Occidentale (2026)" }

sources:
  tf_rates: { authority: third_party, title: "Tax Foundation: 2026 State Individual Income Tax Rates and Brackets (rates as of 1 Jan 2026)", url: "https://taxfoundation.org/data/all/state/state-income-tax-rates-2026/", retrieved: 2026-11-13 }

parameters:
  wv.brackets_single:
    source: tf_rates
    value:
      - { up_to: 10000, rate: 0.0222 }
      - { up_to: 25000, rate: 0.0296 }
      - { up_to: 40000, rate: 0.0333 }
      - { up_to: 60000, rate: 0.0444 }
      - { rate: 0.0482 }
  wv.exemption:
    source: tf_rates
    value: { single: 2000, mfj: 4000 }

rules:
  - id: wv.tax
    label: { en: "West Virginia income tax" }
    note: "Bracketed tax on income less the state standard deduction and personal exemption where the state has them; married filing jointly uses the joint amounts, head of household the single ones."
    expr: bracket(max(0, agi - if(filing_status == 2, $wv.exemption.mfj, $wv.exemption.single)), $wv.brackets_single)

append:
  income_tax: [wv.tax]

not_modelled:
  - wv_credits
  - state_unemployment_benefit
  - state_overtime_rules
