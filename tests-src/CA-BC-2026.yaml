# Golden tests for CA-BC-2026.
# status derived: values from tools/reference_ca_provinces.py, an independent implementation of the
# CRA T4127 formulas (V x A - KP form). Not an official run; tax lines against an official
# calculator are still wanted (see docs/OFFICIAL_RUNS.md).
suite: CA-BC-2026
pack: CA-BC-2026
tolerance: { abs: 0.01 }
cases:
  - id: bc-tax-12000
    status: derived
    inputs: { gross_annual: 12000, as_of: 2026-11-12 }
    expect: { bc.tax: 0.000 }
  - id: bc-tax-25000
    status: derived
    inputs: { gross_annual: 25000, as_of: 2026-11-12 }
    expect: { bc.tax: 0.000 }
  - id: bc-tax-45000
    status: derived
    inputs: { gross_annual: 45000, as_of: 2026-11-12 }
    expect: { bc.tax: 1446.211 }
  - id: bc-tax-70000
    status: derived
    inputs: { gross_annual: 70000, as_of: 2026-11-12 }
    expect: { bc.tax: 3117.092 }
  - id: bc-tax-110000
    status: derived
    inputs: { gross_annual: 110000, as_of: 2026-11-12 }
    expect: { bc.tax: 6378.057 }
  - id: bc-tax-180000
    status: derived
    inputs: { gross_annual: 180000, as_of: 2026-11-12 }
    expect: { bc.tax: 15786.260 }
  - id: bc-overtime-statutory
    status: derived
    inputs: { wage: 20.00, gross_annual: 40000, as_of: 2026-11-12 }
    expect: { bc.overtime_hourly: 30.00, bc.overtime_threshold_hours: 40 }
