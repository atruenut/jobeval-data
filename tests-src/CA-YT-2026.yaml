    status: derived
    inputs: { gross_annual: 25000, as_of: 2026-11-12 }
    expect: { yt.tax: 439.120 }
  - id: yt-tax-45000
    status: derived
    inputs: { gross_annual: 45000, as_of: 2026-11-12 }
    expect: { yt.tax: 1622.096 }
  - id: yt-tax-70000
    status: derived
    inputs: { gross_annual: 70000, as_of: 2026-11-12 }
    expect: { yt.tax: 3383.076 }
  - id: yt-tax-110000
    status: derived
    inputs: { gross_annual: 110000, as_of: 2026-11-12 }
    expect: { yt.tax: 6926.923 }
  - id: yt-tax-180000
    status: derived
    inputs: { gross_annual: 180000, as_of: 2026-11-12 }
