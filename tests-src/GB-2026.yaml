# Golden tests for GB-2026.
# status derived: tools/reference_gb.py arithmetic (own, from the GOV.UK / Scottish Government figures; not an official HMRC run).
suite: GB-2026
pack: GB-2026
tolerance: { abs: 0.01 }
cases:
  - id: gb-10000
    status: derived
    inputs: { gross_annual: 10000, as_of: 2026-11-12 }
    expect: { uk.tax: 0.000, ni.employee: 0.000 }
  - id: gb-25000
    status: derived
    inputs: { gross_annual: 25000, as_of: 2026-11-12 }
    expect: { uk.tax: 2486.000, ni.employee: 994.400 }
  - id: gb-50270
    status: derived
    inputs: { gross_annual: 50270, as_of: 2026-11-12 }
    expect: { uk.tax: 7540.000, ni.employee: 3016.000 }
  - id: gb-80000
    status: derived
    inputs: { gross_annual: 80000, as_of: 2026-11-12 }
    expect: { uk.tax: 19432.000, ni.employee: 3610.600 }
  - id: gb-110000
    status: derived
    inputs: { gross_annual: 110000, as_of: 2026-11-12 }
    expect: { uk.tax: 33432.000, ni.employee: 4210.600 }
  - id: gb-150000
    status: derived
    inputs: { gross_annual: 150000, as_of: 2026-11-12 }
    expect: { uk.tax: 53703.000, ni.employee: 5010.600 }
