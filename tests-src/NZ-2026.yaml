# Golden tests for NZ-2026.
# status derived: tools/reference_au_nz.py (own arithmetic from Deloitte and Baker Tilly figures; not an official run).
suite: NZ-2026
pack: NZ-2026
tolerance: { abs: 0.01 }
cases:
